name: Actualitzacio diaria de Vortabelo

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar el codi del repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Reconstruir diccionari oficial
        run: python construir_vortaro.py

      - name: Generar la web del joc
        run: python generar_web_joc.py

      - name: Desar canvis al repositori
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vortaro_paraulogic.txt index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualitzacio automatica de Vortabelo i vocabulari"
          git push
